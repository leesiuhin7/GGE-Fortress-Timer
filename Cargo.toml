[package]
name = "gge-fortress-timer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
backoff = "0.4.0"
bytes = "1.12.1"
futures-util = "0.3.33"
itertools = "0.15.0"
mongodb = "3.8.0"
rand = "0.10.2"
rustls = "0.23.43"
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rustls = "0.26.6"
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
yawc = "0.4.3"
